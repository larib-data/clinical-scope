name: Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated: windows,macos-arm,macos-intel,linux). Use "all" to build all.'
        default: 'windows'
        type: string
  push:
    tags:
      - 'v*'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_jobs: ${{ steps.set-matrix.outputs.has_jobs }}
    steps:
      - id: set-matrix
        shell: bash
        env:
          PLATFORMS: ${{ github.event_name == 'push' && 'all' || inputs.platforms }}
        run: |
          python3 - <<'EOF'
          import json, os
          platforms = os.environ['PLATFORMS']
          runners = [
              {'os': 'windows-latest', 'artifact_name': 'ClinicalScope-windows-x86_64', 'key': 'windows'},
              {'os': 'macos-latest',   'artifact_name': 'ClinicalScope-macOS-arm64',    'key': 'macos-arm'},
              # {'os': 'macos-13',       'artifact_name': 'ClinicalScope-macOS-intel',    'key': 'macos-intel'},  # wontfix (#27)
              {'os': 'ubuntu-latest',  'artifact_name': 'ClinicalScope-linux-x86_64',   'key': 'linux'},
          ]
          selected = [
              {'os': r['os'], 'artifact_name': r['artifact_name']}
              for r in runners
              if platforms == 'all' or r['key'] in platforms
          ]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"matrix={json.dumps({'include': selected})}\n")
              fh.write(f"has_jobs={'true' if selected else 'false'}\n")
          EOF

  build:
    needs: setup
    if: ${{ needs.setup.outputs.has_jobs == 'true' }}
    name: ${{ matrix.artifact_name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: pyinstaller src/clinical_scope/build_info/core_api.spec --clean --distpath dist --noconfirm

      # Copy static assets into the bundle and write THIRD_PARTY_LICENSES.txt.
      # Shared with build.sh via assemble_bundle.py so the asset list lives once.
      # Warn-only (ADR-0002): a non-zero exit (missing asset, or PyInstaller-
      # stripped dependency licenses needing a map entry) becomes an annotation
      # rather than a failed job -- the release is a draft a human reviews first.
      - name: Assemble bundle (assets + license notices)
        shell: bash
        run: |
          python src/clinical_scope/build_info/assemble_bundle.py --bundle-root dist/ClinicalScope \
            || echo "::warning::Bundle for ${{ matrix.artifact_name }} has unresolved items (missing asset or TODO license entries) -- review before publishing the release."

      - name: Create zip archive
        shell: bash
        run: python -c "import shutil; shutil.make_archive('${{ matrix.artifact_name }}', 'zip', 'dist', 'ClinicalScope')"

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          retention-days: 7

      - name: Attach to GitHub Release (tag push)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.zip
          draft: true
          make_latest: false

  # The user guide PDF, published as a release asset so the release page offers a readable copy.
  # The app no longer resolves its Docs link here: a bundle serves the PDF it ships, and every
  # other install opens the rendered Markdown at its own version. Committed, never built here:
  # regenerating it needs pandoc and LaTeX (docs/user_guide/build_pdf.sh, run once per release).
  # Keep the asset name anyway: installs of 1.3.0 and earlier still point their Docs link at it.
  user_guide:
    name: ClinicalScope_UserGuide.pdf
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Attach to GitHub Release (tag push)
        uses: softprops/action-gh-release@v2
        with:
          files: docs/user_guide/ClinicalScope_UserGuide.pdf
          draft: true
          make_latest: false

  # The demo dataset, published as a release asset so pip installs — which package no example at
  # all — have one to download; `clinical-scope --demo` prints this asset's link for the user to
  # fetch in a browser. The standalone bundle carries its own copy (assemble_bundle.py).
  # The asset name is pinned by constants.DEMO_ARCHIVE_URL and the folder inside it by
  # constants.DEMO_ARCHIVE_ROOT_DIR_NAME, both already carried by every published wheel:
  # renaming either here breaks the paths `--demo` prints for every version already installed.
  example:
    name: clinical-scope-example.zip
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Staged through a filtered copy so the per-run parquet cache and macOS metadata stay out
      # of the archive. Same list as _TREE_IGNORE in assemble_bundle.py; keep the two in step.
      - name: Build the example archive
        run: |
          python3 - <<'EOF'
          import shutil, tempfile
          from pathlib import Path

          # Archived from the folder above, so the zip holds one top-level directory: unzipping
          # by hand leaves a single clinical-scope-example/, not three loose folders.
          with tempfile.TemporaryDirectory() as tmp:
              staged = Path(tmp) / "clinical-scope-example"
              shutil.copytree(
                  "example",
                  staged,
                  ignore=shutil.ignore_patterns("clinical_scope_output", ".DS_Store", "__MACOSX"),
              )
              shutil.make_archive(
                  "clinical-scope-example", "zip", root_dir=tmp, base_dir=staged.name
              )
          EOF

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: clinical-scope-example
          path: clinical-scope-example.zip
          retention-days: 7

      - name: Attach to GitHub Release (tag push)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: clinical-scope-example.zip
          draft: true
          make_latest: false
